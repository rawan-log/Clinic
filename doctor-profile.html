<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Profile - MediCare Clinic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main class="container" id="content"></main>
  <div class="footer">MediCare Clinic · Front-end demo for Information Systems Analysis and Design</div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireRole("patient");
    if (session) { renderNav("doctors"); render(); }

    function render() {
      const d = getDoctor(qs("id"));
      const box = document.getElementById("content");
      if (!d) {
        box.innerHTML = '<div class="card empty"><span class="big">🤷</span>Doctor not found.<br><a class="btn btn-primary mt" href="doctors.html">Back to doctors</a></div>';
        return;
      }
      const week = [];
      for (let i = 0; i < 7; i++) {
        const date = isoDate(i);
        week.push({ date: date, works: doctorWorksOn(d, date), free: freeSlotCount(d, date) });
      }
      box.innerHTML =
        '<p><a href="doctors.html">← Back to doctors</a></p>' +
        '<div class="two-col">' +
        '<section class="card"><div class="row" style="gap:1.2rem;align-items:center">' + avatarHTML(d, true) +
        '<div><h1>' + esc(d.name) + '</h1><span class="badge badge-role">' + esc(d.specialty) + "</span>" +
        '<p class="muted mt" style="margin-bottom:0">' + d.experience + " years of experience</p></div></div>" +
        '<h3 class="mt">About</h3><p>' + esc(d.bio) + "</p>" +
        '<div class="grid grid-3 mt">' +
        '<div class="stat"><span class="label">Consultation fee</span><strong>' + d.fee + " EGP</strong></div>" +
        '<div class="stat"><span class="label">Working days</span><strong>' + daysLabel(d) + "</strong></div>" +
        '<div class="stat"><span class="label">Working hours</span><strong>' + fmtTime(d.from) + " – " + fmtTime(d.to) + "</strong></div></div>" +
        '<h3 class="mt">Availability this week</h3>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">' +
        week.map(function (w) {
          const dt = parseISO(w.date);
          return '<div class="card" style="padding:.7rem;text-align:center;box-shadow:none"><strong>' + DAY_NAMES[dt.getDay()] + " " + dt.getDate() + "</strong><br>" +
            (!w.works ? '<span class="muted small">Off</span>' : w.free ? '<span class="badge badge-success">' + w.free + " free</span>" : '<span class="badge badge-danger">Full</span>') + "</div>";
        }).join("") + "</div></section>" +
        '<aside class="card sticky"><h3>Book an appointment</h3>' +
        '<p class="muted">Pick a date and time that works for you with ' + esc(d.name) + ".</p>" +
        '<a class="btn btn-primary btn-block" href="booking.html?doctor=' + d.id + '">Book now</a>' +
        '<a class="btn btn-ghost btn-block mt" href="doctors.html?specialty=' + encodeURIComponent(d.specialty) + '">More ' + esc(d.specialty) + " doctors</a></aside>" +
        "</div>";
    }
  </script>
</body>
</html>
