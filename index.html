<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login &amp; Sign Up - HakimFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-center-wrap">
    <a class="brand auth-brand-top" href="index.html">
      <span class="brand-logo">✚</span> HakimFlow
    </a>

    <div class="card auth-card">
      <div class="row mb">
        <button type="button" class="btn btn-outline btn-sm" data-theme-toggle>Light / Dark</button>
      </div>

      <div id="authMsg" class="alert hidden"></div>

      <form id="loginForm" novalidate>
        <h2>Login</h2>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="loginPass">Password</label>
          <input type="password" id="loginPass" placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <hr class="auth-divider">

      <details id="signupBox" open>
        <summary class="auth-summary">Sign up</summary>
        <form id="signupForm" class="mt" novalidate>
          <div class="form-group">
            <label for="regName">Full name</label>
            <input type="text" id="regName" placeholder="Full name">
          </div>
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="Email address">
          </div>
          <div class="form-group">
            <label for="regPhone">Phone</label>
            <input type="tel" id="regPhone" placeholder="Phone number">
          </div>
          <div class="form-group">
            <label for="regPass">Password</label>
            <input type="password" id="regPass" placeholder="At least 6 characters">
          </div>
          <div class="row">
            <button type="button" class="btn btn-primary btn-sm" data-target="patient-dashboard.html" data-role="Patient">Sign up as Patient</button>
            <button type="button" class="btn btn-outline btn-sm" data-target="doctor-dashboard.html" data-role="Doctor">Sign up as Doctor</button>
            <button type="button" class="btn btn-outline btn-sm" data-target="admin-dashboard.html" data-role="Admin">Sign up as Admin</button>
          </div>
        </form>
      </details>

      <p class="storage-note" id="storageStatus">No saved user or session yet.</p>
    </div>
  </div>

  <footer class="footer">HakimFlow · Information Systems Analysis and Design</footer>

  <script>
    if (localStorage.getItem("hf_dark") === "1") document.body.classList.add("dark-mode");
    document.querySelectorAll("[data-theme-toggle]").forEach(btn => {
      btn.onclick = () => {
        const dark = document.body.classList.toggle("dark-mode");
        localStorage.setItem("hf_dark", dark ? "1" : "0");
      };
    });

    const msg = document.getElementById("authMsg");
    const showErr = (t) => { msg.className = "alert alert-error"; msg.textContent = t; };
    const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());

    const savedAcc = JSON.parse(localStorage.getItem("hf_account") || "null");
    const activeSess = sessionStorage.getItem("hf_session");
    if (activeSess) storageStatus.textContent = "Session: " + activeSess;
    else if (savedAcc) storageStatus.textContent = "Saved: " + savedAcc.name + " (" + savedAcc.role + ")";

    loginForm.onsubmit = (e) => {
      e.preventDefault();
      if (!emailOk(loginEmail.value)) return showErr("Enter a valid email address.");
      if (loginPass.value.length < 6) return showErr("Password must be at least 6 characters.");
      sessionStorage.setItem("hf_session", loginEmail.value.trim());
      location.href = "patient-dashboard.html";
    };

    document.querySelectorAll("#signupForm [data-target]").forEach(btn => {
      btn.onclick = () => {
        if (regName.value.trim().length < 2) return showErr("Enter your full name.");
        if (!emailOk(regEmail.value)) return showErr("Enter a valid email address.");
        if (regPhone.value.trim().length < 7) return showErr("Enter a valid phone number.");
        if (regPass.value.length < 6) return showErr("Password must be at least 6 characters.");
        const acc = { name: regName.value.trim(), email: regEmail.value.trim(), role: btn.dataset.role };
        localStorage.setItem("hf_account", JSON.stringify(acc));
        sessionStorage.setItem("hf_session", acc.email + " (" + acc.role + ")");
        location.href = btn.dataset.target;
      };
    });
  </script>
</body>
</html>
