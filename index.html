<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login &amp; Sign Up - HakimFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-center-wrap">
    <a class="brand auth-brand-top" href="index.html">
      <span class="brand-logo">✚</span> HakimFlow
    </a>

    <div class="card auth-card">
      <div class="row mb">
        <button type="button" class="btn btn-outline btn-sm" id="themeBtn">Switch Theme</button>
        <span class="muted small" id="themeLabel">Theme: Rose Classic</span>
      </div>

      <div id="authMsg" class="alert hidden"></div>

      <form id="loginForm" novalidate>
        <h2>Login</h2>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="loginPass">Password</label>
          <input type="password" id="loginPass" placeholder="At least 6 characters">
        </div>
        <div class="row mb">
          <button type="submit" class="btn btn-primary">Login</button>
          <a class="btn btn-outline" href="doctor-dashboard.html">Doctor</a>
          <a class="btn btn-outline" href="admin-dashboard.html">Admin</a>
        </div>
      </form>

      <hr class="auth-divider">

      <details id="signupBox">
        <summary class="auth-summary">Sign up for a patient account</summary>
        <form id="signupForm" class="mt" novalidate>
          <div class="form-group">
            <label for="regName">Full name</label>
            <input type="text" id="regName" placeholder="Full name">
          </div>
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="Email address">
          </div>
          <div class="form-group">
            <label for="regPhone">Phone</label>
            <input type="tel" id="regPhone" placeholder="Phone number">
          </div>
          <div class="form-group">
            <label for="regPass">Password</label>
            <input type="password" id="regPass" placeholder="At least 6 characters">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
      </details>

      <p class="storage-note" id="storageStatus">Session: Not signed in yet</p>
    </div>
  </div>

  <script>
    const msg = document.getElementById("authMsg");
    const showMsg = (text, ok) => { msg.className = ok ? "alert alert-success" : "alert alert-error"; msg.textContent = text; };

    // Theme load & toggle save (localStorage)
    const applyTheme = (mode) => {
      document.body.classList.toggle("theme-editorial", mode === "editorial");
      document.getElementById("themeLabel").textContent = "Theme: " + (mode === "editorial" ? "Crimson Editorial" : "Rose Classic");
    };
    const savedTheme = localStorage.getItem("hakimflow_theme") || "classic";
    applyTheme(savedTheme);
    document.getElementById("themeBtn").onclick = () => {
      const next = document.body.classList.contains("theme-editorial") ? "classic" : "editorial";
      localStorage.setItem("hakimflow_theme", next);
      applyTheme(next);
    };

    // Read session user (sessionStorage) & registered patient (localStorage)
    const activeUser = sessionStorage.getItem("hakimflow_session");
    const savedReg = JSON.parse(localStorage.getItem("hakimflow_patient") || "null");
    if (activeUser) document.getElementById("storageStatus").textContent = "Active session (sessionStorage): " + activeUser;
    else if (savedReg) document.getElementById("storageStatus").textContent = "Saved account (localStorage): " + savedReg.email;

    // Custom JS validation (no HTML5 required)
    const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
    loginForm.onsubmit = (e) => {
      e.preventDefault();
      if (!validEmail(loginEmail.value)) return showMsg("Enter a valid email address.", false);
      if (loginPass.value.length < 6) return showMsg("Password must be at least 6 characters.", false);
      sessionStorage.setItem("hakimflow_session", loginEmail.value.trim());
      location.href = "patient-dashboard.html";
    };
    signupForm.onsubmit = (e) => {
      e.preventDefault();
      if (regName.value.trim().length < 2) return showMsg("Enter your full name.", false);
      if (!validEmail(regEmail.value)) return showMsg("Enter a valid email address.", false);
      if (regPhone.value.trim().length < 7) return showMsg("Enter a valid phone number.", false);
      if (regPass.value.length < 6) return showMsg("Password must be at least 6 characters.", false);
      const user = { name: regName.value.trim(), email: regEmail.value.trim() };
      localStorage.setItem("hakimflow_patient", JSON.stringify(user));
      sessionStorage.setItem("hakimflow_session", user.email);
      location.href = "patient-dashboard.html";
    };
  </script>
</body>
</html>
