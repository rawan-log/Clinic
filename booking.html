<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book Appointment - HakimFlow</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body>
<header class="navbar"><div class="navbar-inner"><a class="brand" href="index.html"><span class="brand-logo">✚</span> HakimFlow</a><nav class="nav-links"><a href="index.html">Login</a><a href="patient-dashboard.html">Patient Dashboard</a><a href="doctors.html">Doctors</a><a href="doctor-profile.html">Doctor Profile</a><a href="booking.html" class="active" aria-current="page">Book Appointment</a><a href="my-appointments.html">My Appointments</a><button type="button" class="btn btn-outline btn-sm" data-theme-toggle>Light / Dark</button></nav></div></header>
<main class="container">
<div class="page-head"><div><h1>Book an appointment</h1><p class="muted">Select a doctor, date, and open time slot.</p></div></div><div id="msgBox" class="alert hidden"></div><form id="bookForm" class="two-col" novalidate><section class="card"><div class="form-group"><label for="doc">1. Doctor</label><select id="doc"><option value="">Select a doctor</option><option value="omar">Dr. Omar El-Masry — Cardiology (450 EGP)</option><option value="habiba">Dr. Habiba Tarek — Dermatology (350 EGP)</option><option value="tarek">Dr. Tarek Kamel — Pediatrics (300 EGP)</option><option value="mona">Dr. Mona Salem — Orthopedics (400 EGP)</option></select></div><div class="form-group"><label for="date">2. Date</label><input id="date" type="date" placeholder=""></div><div class="form-group"><label>3. Time slot <span class="muted small">(10:00 AM is booked)</span></label><div class="slots"><button type="button" class="slot booked" data-booked=1>10:00 AM</button><button type="button" class="slot" >10:30 AM</button><button type="button" class="slot" >11:00 AM</button><button type="button" class="slot" >11:30 AM</button></div></div><div class="form-group"><label for="reason">4. Reason for visit</label><textarea id="reason" rows="2" placeholder="Briefly describe your visit reason"></textarea></div></section><aside class="card"><h3>Confirm booking</h3><p class="storage-note" id="lastBookingInfo">No saved booking yet.</p><button class="btn btn-primary btn-block mt">Confirm appointment</button><a class="btn btn-outline btn-sm" href="my-appointments.html">My appointments</a></aside></form>
</main>
<footer class="footer">HakimFlow · Information Systems Analysis and Design</footer>
</body>
</html>
